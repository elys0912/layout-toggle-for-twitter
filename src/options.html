<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <h1 data-i18n="extName"></h1>
      <span class="note" data-i18n="optionsOnLabel"></span>
    </header>

    <div class="banner" id="not-run-banner" hidden>
      <p data-i18n="notRunYet"></p>
    </div>

    <div id="sections"></div>

    <section class="section">
      <h2 class="section-title" data-i18n="sectionLayout"></h2>
      <div class="row">
        <label for="layout-promote" data-i18n="layoutPromote"></label>
        <input type="checkbox" class="switch" id="layout-promote">
      </div>
      <div class="row">
        <label for="layout-widen" data-i18n="layoutWiden"></label>
        <input type="checkbox" class="switch" id="layout-widen">
      </div>
      <p class="note" id="widen-note"></p>
    </section>

    <footer class="page-foot">
      <button type="button" id="reset" data-i18n="buttonReset"></button>
      <p class="note" data-i18n="optionsSaved"></p>
      <p class="note" data-i18n="optionsDisclaimer"></p>
    </footer>
  </main>

  <script src="options.js"></script>
</body>
</html>
